<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- maximum-scale/user-scalable stop iOS zooming in when you tap the input,
     which otherwise leaves the page enlarged and needing a pinch back. The
     cost is real — pinch-zoom is gone, so a long line of code can't be zoomed.
     Chosen deliberately. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sevanya">
<meta name="theme-color" content="#16161a">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="icon" href="/static/icon-192.png">
<title>Sevanya</title>
<style>
  :root { --bg:#16161a; --panel:#1e1e24; --line:#2c2c35; --text:#e6e6ea; --dim:#8b8b99; --accent:#7aa2f7; }
  * { box-sizing: border-box; -webkit-text-size-adjust: 100%; }
  /* Stops iOS rubber-banding the whole page and hijacking a scroll meant for
     the transcript. */
  html, body { overscroll-behavior:none; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font:15px/1.6 ui-sans-serif, -apple-system, system-ui, sans-serif;
    display:flex; flex-direction:column; height:100dvh;
    padding-top: env(safe-area-inset-top);
  }
  header {
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:12px 16px; border-bottom:1px solid var(--line); background:var(--panel);
  }
  header b { font-weight:600; letter-spacing:.02em; }
  header small { color:var(--dim); font-size:12px; }
  header nav { display:flex; gap:8px; margin-left:auto; flex-wrap:wrap; justify-content:flex-end; }
  button {
    background:var(--line); color:var(--text); border:0; border-radius:8px;
    padding:7px 12px; font-size:13px; cursor:pointer;
  }
  button:active { opacity:.7; }
  button.danger { background:#5c2b33; }
  #log {
    flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:16px; display:flex; flex-direction:column; gap:14px;
  }

  /* One panel, used by everything. A dropdown under the header on a desktop;
     a page that covers the screen on a phone. Nothing has a Close at the
     bottom — the way out is Back, top left, where a thumb already is, and it
     stays put while the list scrolls under it. */
  #panel {
    display:none; position:absolute; top:53px; left:0; right:0; max-height:60vh;
    overflow-y:auto; background:var(--panel); border-bottom:1px solid var(--line);
    z-index:10; box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  #panel.open { display:block; }
  #panel .head {
    position:sticky; top:0; background:var(--panel); z-index:1;
    display:flex; align-items:center; gap:12px;
    padding:10px 16px; border-bottom:1px solid var(--line);
  }
  #panel .head span.label {
    color:var(--dim); font-size:12px; letter-spacing:.08em; text-transform:uppercase;
  }
  #panel .head button.act { margin-left:auto; }
  /* Back exists only where the panel covers the screen — on desktop the button
     that opened it is still visible behind and toggles it shut. */
  #panel .head .back { display:none; margin-left:0; }

  @media (max-width: 640px) {
    #panel {
      top:0; height:100dvh; max-height:none;
      padding-top: env(safe-area-inset-top);
    }
    #panel .head .back { display:inline-block; }
    #panel .row { padding:14px 16px; }        /* bigger tap targets */
  }

  #panel .row { padding:11px 16px; border-bottom:1px solid var(--line); }
  #panel .row.tap { cursor:pointer; }
  #panel .row.tap:active { background:var(--line); }
  #panel .row.current { border-left:3px solid var(--accent); }
  #panel .t { display:block; overflow-wrap:anywhere; }
  #panel .t.clip { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #panel .m { color:var(--dim); font-size:12px; }
  #panel .empty, #panel .note { padding:14px 16px; color:var(--dim); font-size:13px; }
  #panel .row.done .t { color:var(--dim); text-decoration:line-through; }
  #panel .row.bad .t { color:#f7768e; }
  #panel .pair { display:flex; justify-content:space-between; gap:12px; }
  #panel .pair b { font-weight:500; }
  #panel .pair b.warn { color:#e0af68; }
  #panel input {
    width:calc(100% - 32px); margin:12px 16px; background:var(--bg); color:var(--text);
    font:inherit; border:1px solid var(--line); border-radius:8px; padding:10px 12px;
  }
  #panel input:focus { outline:none; border-color:var(--accent); }

  .msg { max-width:80ch; white-space:pre-wrap; overflow-wrap:anywhere; }
  .you { align-self:flex-end; background:var(--accent); color:#0d1117;
         padding:9px 13px; border-radius:14px 14px 3px 14px; }
  .her { align-self:flex-start; }
  .tool { align-self:flex-start; color:var(--dim); font-family:ui-monospace, monospace; font-size:12px; }
  .err  { align-self:flex-start; color:#f7768e; font-family:ui-monospace, monospace; font-size:12px; }
  footer {
    display:flex; gap:8px; padding:12px 16px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line); background:var(--panel);
  }
  textarea {
    flex:1; resize:none; background:var(--bg); color:var(--text);
    border:1px solid var(--line); border-radius:10px; padding:10px 12px;
    font:inherit; max-height:35vh;
  }
  textarea:focus { outline:none; border-color:var(--accent); }
  sup { color:var(--accent); font-size:10px; margin-left:3px; }
</style>
</head>
<body>
<header>
  <b>Sevanya</b>
  <small id="status">ready</small>
  <nav>
    <button id="chats">Chats</button>
    <button id="refresh" title="Reload this thread from the server">↻</button>
    <button id="tasks-btn">Tasks</button>
    <button id="notices-btn">Notices<sup id="notices-count"></sup></button>
    <button id="data-btn">Data</button>
    <button id="restart-btn" title="Restart the server process">⏻</button>
  </nav>
</header>

<div id="panel"></div>
<div id="log"></div>

<footer>
  <textarea id="input" rows="1" placeholder="Ask her something…" autocomplete="off"></textarea>
  <button id="send">Send</button>
</footer>

<script>
// Installed first, and deliberately in its own block. Anything that throws at
// the top level of the next script aborts the whole of it — every handler
// after the failure never binds, so the page paints and then does nothing.
// That's invisible on a phone, where there is no console to look at. Put it
// on screen instead.
//
// A syntax error is thrown while a script is being *compiled*, so a handler
// inside that same script would never have registered to catch it. Hence the
// separate block, and hence writing to the DOM directly here rather than
// calling anything defined later.
(function () {
  function show(text) {
    var log = document.getElementById('log');
    if (!log) return;
    var el = document.createElement('div');
    el.className = 'msg err';
    el.textContent = text;
    log.appendChild(el);
    var status = document.getElementById('status');
    if (status) status.textContent = 'script error';
  }
  window.addEventListener('error', function (e) {
    // Inline scripts report the page URL as the filename, whose last path
    // segment is empty — so fall back to 'page' rather than printing '[:229]'.
    var where = (e.filename || '').split('/').pop() || 'page';
    show('[' + where + ':' + (e.lineno || '?') + '] ' + (e.message || 'error'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    show('unhandled: ' + ((e.reason && e.reason.message) || e.reason));
  });
})();
</script>

<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const status = document.getElementById('status');
const panel = document.getElementById('panel');
const noticesCount = document.getElementById('notices-count');

// Remembered across reloads so the phone rejoins its own thread, not Siri's.
let conversationId = Number(localStorage.getItem('conversationId')) || null;
let busy = false;

// The token, if this Sevanya is running with one. Three ways in, in order:
// a ?token= in the URL (so a QR code or a Shortcut can carry it), whatever was
// saved on a previous visit, or the panel below asking for it. The old
// instruction to set localStorage from the console is no use on the device
// this is built for — iOS Safari has no console.
let token = new URL(location).searchParams.get('token');
if (token) {
  localStorage.setItem('token', token);
  history.replaceState(null, '', location.pathname);
} else {
  token = localStorage.getItem('token');
}

function authHeaders(extra) {
  const headers = Object.assign({}, extra || {});
  if (token) headers['Authorization'] = 'Bearer ' + token;
  return headers;
}

// Wire a handler by id. Doing this directly —
//   document.getElementById('refresh').onclick = ...
// — throws "Cannot set properties of null" if the markup and the script
// disagree about the id, and because that throw is at top level it kills every
// line after it too: send stops working, the transcript stops loading, the
// whole page goes inert for one wrong string. This reports the mismatch and
// carries on binding everything else.
function bind(id, handler) {
  const el = document.getElementById(id);
  if (!el) {
    console.error('no element #' + id);
    add('err', 'missing button #' + id + ' — markup and script disagree');
    return;
  }
  el.onclick = handler;
}

// True when the view is parked at (or near) the newest message. If you've
// scrolled up to read something, this goes false and we stop dragging you back
// down every time another chunk arrives — which is what made reading anything
// mid-reply a fight.
function atBottom() {
  return log.scrollHeight - log.scrollTop - log.clientHeight < 80;
}

function followIfAtBottom(wasAtBottom) {
  if (wasAtBottom) log.scrollTop = log.scrollHeight;
}

function add(cls, text) {
  const wasAtBottom = atBottom();
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  log.appendChild(el);
  followIfAtBottom(wasAtBottom);
  return el;
}

// --- the panel -------------------------------------------------------------
// One component for every list and every question. Opening a second one closes
// the first, so there is never a stack of things to dismiss.

let openName = null;

function closePanel() {
  panel.classList.remove('open');
  panel.innerHTML = '';
  openName = null;
}

function head(label, actionLabel, actionFn) {
  const bar = document.createElement('div');
  bar.className = 'head';

  const back = document.createElement('button');
  back.className = 'back';
  back.textContent = '‹ Back';
  back.onclick = closePanel;

  const name = document.createElement('span');
  name.className = 'label';
  name.textContent = label;

  bar.append(back, name);

  if (actionLabel) {
    const action = document.createElement('button');
    action.className = 'act';
    action.textContent = actionLabel;
    action.onclick = actionFn;
    bar.append(action);
  }
  return bar;
}

function body() {
  const el = document.createElement('div');
  el.className = 'body';
  return el;
}

function note(text, cls) {
  const el = document.createElement('div');
  el.className = cls || 'note';
  el.textContent = text;
  return el;
}

function row(title, meta, opts) {
  const settings = opts || {};
  const el = document.createElement('div');
  el.className = 'row' + (settings.cls ? ' ' + settings.cls : '') + (settings.onTap ? ' tap' : '');
  const t = document.createElement('span');
  t.className = 't' + (settings.clip ? ' clip' : '');
  t.textContent = title;
  el.append(t);
  if (meta) {
    const m = document.createElement('span');
    m.className = 'm';
    m.textContent = meta;
    el.append(m);
  }
  if (settings.onTap) el.onclick = settings.onTap;
  return el;
}

function pair(label, value, warn) {
  const el = document.createElement('div');
  el.className = 'row';
  const line = document.createElement('div');
  line.className = 'pair';
  const name = document.createElement('span');
  name.className = 'm';
  name.textContent = label;
  const amount = document.createElement('b');
  amount.textContent = value;
  if (warn) amount.className = 'warn';
  line.append(name, amount);
  el.append(line);
  return el;
}

/** Open a named panel. Tapping the same button again closes it. */
async function show(name, label, build, actionLabel, actionFn) {
  if (openName === name) { closePanel(); return; }
  openName = name;
  panel.innerHTML = '';
  panel.append(head(label, actionLabel, actionFn));
  const content = body();
  content.append(note('loading…', 'empty'));
  panel.append(content);
  panel.classList.add('open');

  try {
    content.innerHTML = '';
    await build(content);
  } catch (err) {
    content.innerHTML = '';
    content.append(note(String(err), 'empty'));
  }
}

/** Replace just the body of the open panel, keeping it open. */
function replace(label, build, actionLabel, actionFn) {
  panel.innerHTML = '';
  panel.append(head(label, actionLabel, actionFn));
  const content = body();
  panel.append(content);
  build(content);
}

// Tapping the page behind a desktop dropdown closes it, the way a menu does.
//
// Capture phase, deliberately. On the way *down* the clicked element is still
// in the document; by the time a bubbled listener runs, a row whose handler
// rebuilt the panel has been detached, so panel.contains(target) is false and
// this would close the panel the row just opened. That cost an afternoon to
// see once and is invisible in the code otherwise.
document.addEventListener('click', e => {
  if (!panel.classList.contains('open')) return;
  if (panel.contains(e.target) || e.target.closest('header nav')) return;
  closePanel();
}, true);

// --- the token -------------------------------------------------------------

let onToken = null;

function askToken(then) {
  onToken = then;
  show('token', 'Token required', content => {
    content.append(note(
      'This Sevanya runs with SEVANYA_TOKEN set. Paste the same string — it ' +
      'stays on this device and is sent with every request.'));

    const field = document.createElement('input');
    field.id = 'token-input';
    field.type = 'password';
    field.placeholder = 'SEVANYA_TOKEN';
    field.autocomplete = 'off';
    field.autocapitalize = 'off';
    field.spellcheck = false;
    field.value = token || '';
    field.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); saveToken(field.value); }
    });
    content.append(field);
    field.focus();
  }, 'Save', () => saveToken(document.getElementById('token-input').value));
}

function saveToken(value) {
  value = (value || '').trim();
  if (!value) return;
  token = value;
  localStorage.setItem('token', value);
  closePanel();
  const then = onToken; onToken = null;
  if (then) then();
}

// --- chats -----------------------------------------------------------------

function newConversation() {
  conversationId = null;
  localStorage.removeItem('conversationId');
  log.innerHTML = '';
  closePanel();
  status.textContent = 'new conversation';
}

bind('chats', () => show('chats', 'Recent', async content => {
  const res = await fetch('/api/conversations', { headers: authHeaders() });
  if (res.status === 401) { askToken(() => document.getElementById('chats').click()); return; }
  if (!res.ok) throw new Error('HTTP ' + res.status);

  const rows = await res.json();
  if (!rows.length) { content.append(note('no conversations yet', 'empty')); return; }
  for (const r of rows) {
    content.append(row(
      r.title || '(untitled)',
      '#' + r.id + ' · ' + r.n + ' messages · ' + r.updated_at,
      { clip: true, cls: r.id === conversationId ? 'current' : '', onTap: () => openConversation(r.id) }
    ));
  }
}, '+ New', newConversation));

// Load a transcript and make it the active thread. One code path for "show me
// this conversation", used by the picker, the refresh button and startup, so
// the three can't drift apart.
async function openConversation(id) {
  closePanel();
  status.textContent = 'loading…';
  try {
    const res = await fetch('/api/conversations/' + id, { headers: authHeaders() });
    if (res.status === 401) { askToken(() => openConversation(id)); return; }
    if (res.status === 404) {
      // The database was reset or the thread is gone. Drop the id rather than
      // sitting in a conversation the server has never heard of.
      conversationId = null;
      localStorage.removeItem('conversationId');
      log.innerHTML = '';
      status.textContent = 'new conversation';
      return;
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);

    log.innerHTML = '';
    for (const m of await res.json()) add(m.role === 'user' ? 'you' : 'her', m.text);
    conversationId = id;
    localStorage.setItem('conversationId', id);
    status.textContent = 'conversation ' + id;
    log.scrollTop = log.scrollHeight;
  } catch (err) {
    add('err', String(err));
    status.textContent = 'ready';
  }
}

bind('refresh', () => {
  // Worth having because the transcript changes without this device doing
  // anything — ask Siri something with the page open and it lands in the
  // database, not in this log.
  if (busy) return;
  if (!conversationId) { status.textContent = 'nothing to refresh'; return; }
  openConversation(conversationId);
});

if (conversationId) openConversation(conversationId);

// --- her list, read-only ---------------------------------------------------
// She writes it; we display it. There is deliberately no way to tick one off
// from here: it's her list of what you should do, and a checkbox would make it
// yours.

bind('tasks-btn', () => show('tasks', 'Her list', async content => {
  const res = await fetch('/api/tasks', { headers: authHeaders() });
  if (res.status === 401) { askToken(() => document.getElementById('tasks-btn').click()); return; }
  if (!res.ok) throw new Error('HTTP ' + res.status);

  const rows = await res.json();
  content.append(note('She decides what goes on here and marks things off. ' +
                      'Ask her if something needs to change.'));
  if (!rows.length) { content.append(note('nothing on it yet', 'empty')); return; }
  for (const r of rows) {
    content.append(row((r.done ? '✓  ' : '•  ') + r.task, null, { cls: r.done ? 'done' : '' }));
  }
}));

// --- notices, read-only ----------------------------------------------------

async function loadNotices() {
  const res = await fetch('/api/notifications', { headers: authHeaders(), cache: 'no-store' });
  if (res.status === 401) return null;
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

// How many have arrived since this device last looked. Kept here rather than
// on the server: "seen" is a property of this phone, not of the notice, and
// marking one read would be a write to a read-only log.
async function refreshNoticeCount() {
  try {
    const rows = await loadNotices();
    if (!rows) return;
    const seen = Number(localStorage.getItem('lastNotice')) || 0;
    const fresh = rows.filter(r => r.id > seen).length;
    noticesCount.textContent = fresh ? String(fresh) : '';
  } catch (_) { /* offline — not worth an error line */ }
}

bind('notices-btn', () => show('notices', 'Notices', async content => {
  const rows = await loadNotices();
  if (rows === null) { askToken(() => document.getElementById('notices-btn').click()); return; }
  if (!rows.length) { content.append(note('nothing yet', 'empty')); return; }
  for (const r of rows) {
    content.append(row(r.message, r.created_at + ' · ' + r.kind,
                       { cls: r.kind.endsWith('failed') ? 'bad' : '' }));
  }
  localStorage.setItem('lastNotice', rows[0].id);
  noticesCount.textContent = '';
}));

refreshNoticeCount();

// --- the database ----------------------------------------------------------

let dbState = null;

async function loadDb() {
  const res = await fetch('/api/db', { headers: authHeaders(), cache: 'no-store' });
  if (res.status === 401) return null;
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function renderDb(content, state) {
  dbState = state;
  for (const [table, count] of Object.entries(state.counts)) {
    content.append(pair(table.replace('_', ' '), String(count)));
  }
  content.append(pair('answering', state.backend));
  content.append(pair('schema version',
    state.schema_version + ' / ' + state.schema_expects,
    state.schema_version !== state.schema_expects));
  if (state.pending_migrations.length) {
    content.append(pair('pending migrations',
      state.pending_migrations.length + ' — press ⏻ to apply', true));
  }
  if (state.drift.length) content.append(pair('SCHEMA DRIFT', state.drift.join('; '), true));
  content.append(pair('unloadable messages', String(state.unloadable), state.unloadable > 0));
  content.append(pair('backups', state.backups.length ? state.backups[0].name : 'none yet'));

  content.append(row('Clear chats…', 'deletes conversations, keeps her journal and your list',
                     { cls: 'bad', onTap: confirmClear }));
}

async function openDb() {
  await show('db', 'Database', async content => {
    const state = await loadDb();
    if (state === null) { askToken(openDb); return; }
    renderDb(content, state);
  }, 'Back up', backupNow);
}

bind('data-btn', openDb);

async function backupNow() {
  try {
    const res = await fetch('/api/db/backup', { method: 'POST', headers: authHeaders() });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const saved = await res.json();
    status.textContent = 'backed up ' + saved.name;
    openName = null;
    await openDb();
  } catch (err) {
    add('err', 'backup failed: ' + err);
  }
}

// Deleting history is a second, deliberate step. The row above only brings you
// here; nothing is removed until the action in this head is pressed.
function confirmClear() {
  if (!dbState) return;
  replace('Delete chats?', content => {
    content.append(note(
      dbState.counts.conversations + ' conversations and ' + dbState.counts.messages +
      ' messages will be deleted. Her journal, your task list and the notices are ' +
      'kept. A backup is taken first, and it cannot be skipped from here.'));
  }, 'Delete them', clearNow);
}

async function clearNow() {
  try {
    const res = await fetch('/api/db/clear-history', {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      // Sent explicitly rather than implied by the request, so nothing that
      // merely reaches this endpoint can delete anything.
      body: JSON.stringify({ confirm: true, keep_days: 0 }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const done = await res.json();

    closePanel();
    // The thread this device was in no longer exists.
    conversationId = null;
    localStorage.removeItem('conversationId');
    log.innerHTML = '';
    add('tool', 'removed ' + done.removed.conversations + ' conversations and ' +
                done.removed.messages + ' messages — backup ' + done.backup);
    status.textContent = 'history cleared';
  } catch (err) {
    add('err', 'clear failed: ' + err);
  }
}

// --- restarting ------------------------------------------------------------

bind('restart-btn', () => show('restart', 'Restart', content => {
  content.append(note(
    'The process on your PC restarts, picking up code and requirement changes. ' +
    'A reply still streaming is lost; conversations, her journal and the task ' +
    'list are on disk and unaffected.'));
}, 'Restart now', restartNow));

async function health() {
  // cache: no-store, or a phone will answer from cache and tell you the server
  // is up while it's still restarting.
  const res = await fetch('/api/health', { headers: authHeaders(), cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function restartNow() {
  closePanel();
  status.textContent = 'restarting…';

  let before = null;
  try { before = (await health()).started; } catch (_) { /* answer anyway */ }

  try {
    const res = await fetch('/api/restart', { method: 'POST', headers: authHeaders() });
    if (res.status === 401) { askToken(restartNow); return; }
    if (!res.ok) throw new Error('HTTP ' + res.status);
  } catch (err) {
    add('err', 'could not ask it to restart: ' + err);
    status.textContent = 'ready';
    return;
  }

  // Wait for it to actually come back. The process keeps its pid across an
  // execv, so `started` is what distinguishes a real restart from a server
  // that never went down.
  const deadline = Date.now() + 30000;
  while (Date.now() < deadline) {
    await new Promise(r => setTimeout(r, 500));
    try {
      const now = await health();
      if (before === null || now.started > before) {
        // A full reload rather than re-syncing: the usual reason to restart is
        // that the code on disk changed, and this page is part of that code.
        status.textContent = 'restarted';
        location.reload();
        return;
      }
    } catch (_) { /* still down — expected for a moment */ }
  }
  add('err', 'the server did not come back within 30s — check the machine it runs on');
  status.textContent = 'offline';
}

// --- talking to her --------------------------------------------------------

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = input.scrollHeight + 'px';
});

// Enter sends; Shift+Enter is a newline. On a phone the on-screen keyboard
// sends Enter as a newline, so the Send button is the real path there.
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
bind('send', send);

async function send() {
  const message = input.value.trim();
  if (!message || busy) return;

  busy = true;
  closePanel();
  const echo = add('you', message);
  input.value = '';
  input.style.height = 'auto';
  status.textContent = 'thinking…';

  let bubble = null;
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ message, conversation_id: conversationId }),
    });
    if (res.status === 401) {
      // Ask for the token and resend once it's in — losing what you typed to
      // an auth prompt is the kind of thing that makes you stop using it. The
      // retry re-echoes the message, so drop this bubble first.
      echo.remove();
      status.textContent = 'token needed';
      askToken(() => { input.value = message; send(); });
      return;
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);

    // Read the SSE stream by hand. EventSource would be simpler but it's
    // GET-only, and messages can be long.
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      // Events are separated by a blank line; the last chunk may be partial.
      const parts = buffer.split('\n\n');
      buffer = parts.pop();

      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith('data:')) continue;
        const ev = JSON.parse(line.slice(5));

        if (ev.type === 'conversation') {
          conversationId = ev.id;
          localStorage.setItem('conversationId', ev.id);
          status.textContent = 'conversation ' + ev.id;
        } else if (ev.type === 'text') {
          const wasAtBottom = atBottom();
          if (!bubble) bubble = add('her', '');
          bubble.textContent += ev.text;
          followIfAtBottom(wasAtBottom);
        } else if (ev.type === 'tool') {
          add('tool', '[' + ev.text + ']');
          bubble = null;           // any text after a tool starts a new bubble
        } else if (ev.type === 'error') {
          add('err', ev.text);
        }
      }
    }
  } catch (err) {
    add('err', String(err));
  } finally {
    // Cleared here rather than at each exit, including the 401 path above —
    // the retry calls send() again and would bounce off a stale busy flag.
    busy = false;
    if (status.textContent === 'thinking…') status.textContent = 'ready';
    refreshNoticeCount();
  }
}
</script>
