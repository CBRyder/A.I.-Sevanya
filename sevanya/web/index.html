<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sevanya">
<meta name="theme-color" content="#16161a">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="icon" href="/static/icon-192.png">
<title>Sevanya</title>
<style>
  :root { --bg:#16161a; --panel:#1e1e24; --line:#2c2c35; --text:#e6e6ea; --dim:#8b8b99; --accent:#7aa2f7; }
  * { box-sizing: border-box; -webkit-text-size-adjust: 100%; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font:15px/1.6 ui-sans-serif, -apple-system, system-ui, sans-serif;
    display:flex; flex-direction:column; height:100dvh;
    padding-top: env(safe-area-inset-top);
  }
  header {
    display:flex; align-items:center; gap:12px;
    padding:12px 16px; border-bottom:1px solid var(--line); background:var(--panel);
  }
  header b { font-weight:600; letter-spacing:.02em; }
  header small { color:var(--dim); font-size:12px; margin-left:auto; }
  button {
    background:var(--line); color:var(--text); border:0; border-radius:8px;
    padding:7px 12px; font-size:13px; cursor:pointer;
  }
  button:active { opacity:.7; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:80ch; white-space:pre-wrap; overflow-wrap:anywhere; }
  .you { align-self:flex-end; background:var(--accent); color:#0d1117;
         padding:9px 13px; border-radius:14px 14px 3px 14px; }
  .her { align-self:flex-start; }
  .tool { align-self:flex-start; color:var(--dim); font-family:ui-monospace, monospace; font-size:12px; }
  .err  { align-self:flex-start; color:#f7768e; font-family:ui-monospace, monospace; font-size:12px; }
  footer {
    display:flex; gap:8px; padding:12px 16px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line); background:var(--panel);
  }
  textarea {
    flex:1; resize:none; background:var(--bg); color:var(--text);
    border:1px solid var(--line); border-radius:10px; padding:10px 12px;
    font:inherit; max-height:35vh;
  }
  textarea:focus { outline:none; border-color:var(--accent); }

  /* Overlays: the token gate and the thread picker. Same shell, so they
     look like one idea rather than two bolted-on panels. */
  .sheet {
    position:fixed; inset:0; background:rgba(0,0,0,.6);
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .sheet[data-open] { display:flex; }
  .sheet > div {
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:18px; width:100%; max-width:420px; max-height:70dvh; overflow-y:auto;
  }
  .sheet h2 { margin:0 0 6px; font-size:15px; font-weight:600; }
  .sheet p  { margin:0 0 12px; color:var(--dim); font-size:13px; }
  .sheet input {
    width:100%; background:var(--bg); color:var(--text); font:inherit;
    border:1px solid var(--line); border-radius:8px; padding:10px 12px;
    margin-bottom:10px;
  }
  .sheet input:focus { outline:none; border-color:var(--accent); }
  .row { display:flex; gap:8px; justify-content:flex-end; }
  .thread {
    padding:10px 12px; border-radius:8px; cursor:pointer; border:1px solid transparent;
  }
  .thread:active { background:var(--line); }
  .thread b { display:block; font-weight:500; overflow-wrap:anywhere; }
  .thread span { color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<header>
  <b>Sevanya</b>
  <button id="new">New</button>
  <button id="threads-btn">Threads</button>
  <small id="status">ready</small>
</header>

<div id="log"></div>

<footer>
  <textarea id="input" rows="1" placeholder="Ask her something…" autocomplete="off"></textarea>
  <button id="send">Send</button>
</footer>

<!-- Token entry. There is no browser console on a phone, so this is the only
     way to get a token into the app on the device it's actually for. -->
<div class="sheet" id="gate">
  <div>
    <h2>Token required</h2>
    <p>This Sevanya is running with <code>SEVANYA_TOKEN</code> set. Paste the same
       string here — it's kept on this device and sent with every request.</p>
    <input id="token-input" type="password" placeholder="SEVANYA_TOKEN"
           autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="row">
      <button id="gate-cancel">Cancel</button>
      <button id="gate-save">Save</button>
    </div>
  </div>
</div>

<div class="sheet" id="threads">
  <div>
    <h2>Conversations</h2>
    <p>Including anything asked through Siri.</p>
    <div id="thread-list"></div>
    <div class="row"><button id="threads-close">Close</button></div>
  </div>
</div>

<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const status = document.getElementById('status');
// Remembered across reloads so the phone rejoins its own thread, not Siri's.
let conversationId = Number(localStorage.getItem('conversationId')) || null;
let busy = false;

// The token, if this Sevanya is running with one. Three ways in, in order:
// a ?token= in the URL (so a QR code or a Shortcut can carry it), whatever
// was saved on a previous visit, or the gate below asking for it. The old
// instruction to set localStorage from the console is no use on the device
// this is built for — iOS Safari has no console.
let token = new URL(location).searchParams.get('token');
if (token) {
  localStorage.setItem('token', token);
  // Don't leave it sitting in the address bar or the history entry.
  history.replaceState(null, '', location.pathname);
} else {
  token = localStorage.getItem('token');
}

function authHeaders(extra) {
  const headers = Object.assign({}, extra || {});
  if (token) headers['Authorization'] = 'Bearer ' + token;
  return headers;
}

const gate = document.getElementById('gate');
const tokenInput = document.getElementById('token-input');
let onToken = null;   // what to do once a token is entered

function askToken(then) {
  onToken = then;
  tokenInput.value = token || '';
  gate.setAttribute('data-open', '');
  tokenInput.focus();
}

document.getElementById('gate-save').onclick = () => {
  const value = tokenInput.value.trim();
  if (!value) return;
  token = value;
  localStorage.setItem('token', value);
  gate.removeAttribute('data-open');
  const then = onToken; onToken = null;
  if (then) then();
};
document.getElementById('gate-cancel').onclick = () => {
  gate.removeAttribute('data-open');
  onToken = null;
  status.textContent = 'no token';
};
tokenInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); document.getElementById('gate-save').click(); }
});

function add(cls, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = input.scrollHeight + 'px';
});

// Enter sends; Shift+Enter is a newline. On a phone the on-screen keyboard
// sends Enter as a newline, so the Send button is the real path there.
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
document.getElementById('send').onclick = send;
document.getElementById('new').onclick = () => {
  conversationId = null;
  localStorage.removeItem('conversationId');
  log.innerHTML = '';
  status.textContent = 'new conversation';
};

// Reload whatever thread this device was last in.
async function restore() {
  if (!conversationId) return;
  try {
    const res = await fetch('/api/conversations/' + conversationId,
                            { headers: authHeaders() });
    if (res.status === 401) { askToken(restore); return; }
    if (res.status === 404) {
      // The database was reset or the thread is gone. Drop the id rather
      // than sitting in a conversation the server has never heard of.
      conversationId = null;
      localStorage.removeItem('conversationId');
      status.textContent = 'new conversation';
      return;
    }
    if (!res.ok) return;
    log.innerHTML = '';
    for (const m of await res.json()) add(m.role === 'user' ? 'you' : 'her', m.text);
    status.textContent = 'conversation ' + conversationId;
  } catch (_) { /* offline or server down — start clean */ }
}
restore();

// --- thread picker -------------------------------------------------------
// The server has always exposed /api/conversations; nothing was calling it,
// so there was no way to get back to yesterday's thread from the phone.
const threads = document.getElementById('threads');
const threadList = document.getElementById('thread-list');

document.getElementById('threads-close').onclick = () => threads.removeAttribute('data-open');
threads.onclick = e => { if (e.target === threads) threads.removeAttribute('data-open'); };
gate.onclick = e => { if (e.target === gate) document.getElementById('gate-cancel').click(); };

document.getElementById('threads-btn').onclick = async () => {
  threadList.textContent = 'loading…';
  threads.setAttribute('data-open', '');
  try {
    const res = await fetch('/api/conversations', { headers: authHeaders() });
    if (res.status === 401) {
      threads.removeAttribute('data-open');
      askToken(() => document.getElementById('threads-btn').click());
      return;
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const rows = await res.json();
    threadList.innerHTML = '';
    if (!rows.length) { threadList.textContent = 'nothing yet'; return; }

    for (const row of rows) {
      const el = document.createElement('div');
      el.className = 'thread';
      const title = document.createElement('b');
      title.textContent = row.title || '(untitled)';
      const meta = document.createElement('span');
      meta.textContent = `${row.updated_at} · ${row.n} messages`;
      el.append(title, meta);
      el.onclick = () => {
        conversationId = row.id;
        localStorage.setItem('conversationId', row.id);
        threads.removeAttribute('data-open');
        log.innerHTML = '';
        restore();
      };
      threadList.appendChild(el);
    }
  } catch (err) {
    threadList.textContent = String(err);
  }
};

async function send() {
  const message = input.value.trim();
  if (!message || busy) return;

  busy = true;
  const echo = add('you', message);
  input.value = '';
  input.style.height = 'auto';
  status.textContent = 'thinking…';

  let bubble = null;
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ message, conversation_id: conversationId }),
    });
    if (res.status === 401) {
      // Ask for the token and resend once it's in — losing what you typed to
      // an auth prompt is the kind of thing that makes you stop using it.
      // The retry re-echoes the message, so drop this bubble first.
      echo.remove();
      status.textContent = 'token needed';
      askToken(() => { input.value = message; send(); });
      return;
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);

    // Read the SSE stream by hand. EventSource would be simpler but it's
    // GET-only, and messages can be long.
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      // Events are separated by a blank line; the last chunk may be partial.
      const parts = buffer.split('\n\n');
      buffer = parts.pop();

      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith('data:')) continue;
        const ev = JSON.parse(line.slice(5));

        if (ev.type === 'conversation') {
          conversationId = ev.id;
          localStorage.setItem('conversationId', ev.id);
          status.textContent = 'conversation ' + ev.id;
        } else if (ev.type === 'text') {
          if (!bubble) bubble = add('her', '');
          bubble.textContent += ev.text;
          log.scrollTop = log.scrollHeight;
        } else if (ev.type === 'tool') {
          add('tool', '[' + ev.text + ']');
          bubble = null;           // any text after a tool starts a new bubble
        } else if (ev.type === 'error') {
          add('err', ev.text);
        }
      }
    }
  } catch (err) {
    add('err', String(err));
  } finally {
    // Cleared here rather than at each exit, including the 401 path above —
    // the retry calls send() again and would bounce off a stale busy flag.
    busy = false;
    if (status.textContent === 'thinking…') status.textContent = 'ready';
  }
}
</script>
</body>
</html>
